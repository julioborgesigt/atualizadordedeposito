name: CI & Deploy Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    name: Testes, Build e Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos (svelte-check)
        run: npm run check

      - name: Rodar testes unitários (Vitest)
        run: npm test

      - name: Build de produção (SvelteKit + Adapter Cloudflare)
        run: npm run build

      - name: Aplicar migrações no Cloudflare D1 (Produção)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q "SUBSTITUA_PELO_SEU_DATABASE_ID" wrangler.toml; then
            echo "Aviso: database_id ainda não configurado no wrangler.toml. Pulando migração automática do D1."
          else
            npx wrangler d1 migrations apply custodia-pcce-db --remote
          fi

      - name: Deploy no Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .svelte-kit/cloudflare --project-name=custodia-pcce --branch=main
