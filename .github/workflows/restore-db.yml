name: Restore D1 Database (Time Travel)

on:
  workflow_dispatch:
    inputs:
      timestamp:
        description: 'Timestamp UTC para restauracao (ex: 2026-11-26T15:00:00Z)'
        required: true
        default: '2026-11-26T15:00:00Z'

jobs:
  restore:
    name: Restaurar D1 via Time Travel
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Restaurar banco via Wrangler
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          fi
          yes | npx wrangler d1 time-travel restore custodia-pcce-db --timestamp="${{ github.event.inputs.timestamp }}"
